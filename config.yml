backend:
  name: git-gateway
  branch: main   # change to "master" here if that's your repo's default branch

# Where uploaded images get stored in the repo, and the URL prefix used to
# reference them from content files.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://yourusername.github.io/your-repo-name
display_url: https://yourusername.github.io/your-repo-name

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "content/homepage.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Headline (use <br> for a line break)", name: "headline", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "text" }
              - { label: "Background Photo", name: "image", widget: "image" }

          - label: "Urgent Appeal Banner"
            name: "appeal"
            widget: "object"
            fields:
              - { label: "Label (e.g. 'Urgent Appeal')", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button Link (e.g. campaign-detail.html)", name: "link", widget: "string" }

          - label: "Impact Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Number", name: "value", widget: "number" }
              - { label: "Prefix (e.g. $)", name: "prefix", widget: "string", required: false }
              - { label: "Suffix (e.g. +, M+)", name: "suffix", widget: "string", required: false }
              - { label: "Label", name: "label", widget: "string" }

          - label: "Featured Campaigns"
            name: "campaigns"
            widget: "list"
            fields:
              - { label: "Category Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Amount Raised (e.g. PKR 6.8M)", name: "raised", widget: "string" }
              - { label: "Goal (e.g. PKR 10M)", name: "goal", widget: "string" }
              - { label: "Percent Funded (0-100)", name: "percent", widget: "number" }
              - { label: "Link", name: "link", widget: "string", default: "campaign-detail.html" }

          - label: "Trust Section"
            name: "trust"
            widget: "object"
            fields:
              - { label: "Eyebrow label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Photo", name: "image", widget: "image" }
              - label: "Trust Bullet Points"
                name: "bullets"
                widget: "list"
                field: { label: "Point", name: "point", widget: "string" }

          - label: "Latest News"
            name: "news"
            widget: "list"
            fields:
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Link", name: "link", widget: "string", default: "#" }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "Contact & Social"
        file: "content/settings.json"
        fields:
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Office Address", name: "address", widget: "string" }
              - { label: "Office Hours", name: "hours", widget: "string" }

          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string" }
              - { label: "Instagram URL", name: "instagram", widget: "string" }
              - { label: "Twitter / X URL", name: "twitter", widget: "string" }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
