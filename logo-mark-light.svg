  <path d="M100 42 C 92 60 88 80 92 100" stroke="#FFFFFF" stroke-width="2" opacity="0.22" stroke-linecap="round" fill="none"/>
  <path d="M100 42 C 108 60 112 80 108 100" stroke="#FFFFFF" stroke-width="2" opacity="0.22" stroke-linecap="round" fill="none"/>
  <path d="M100 46 L100 158" stroke="#FFFFFF" stroke-width="2.5" opacity="0.3" stroke-linecap="round"/>
  <path d="M46 70 C 50 58 58 50 68 46" stroke="#FFFFFF" stroke-width="2" opacity="0.18" stroke-linecap="round" fill="none"/>
  <path d="M154 70 C 150 58 142 50 132 46" stroke="#FFFFFF" stroke-width="2" opacity="0.18" stroke-linecap="round" fill="none"/>

  <!-- Leaf -->
  <g transform="translate(100 100) rotate(-18)">
    <path d="M0 -34 C 22 -30 34 -12 34 8 C 34 26 20 36 0 36 C -20 36 -34 26 -34 8 C -34 -12 -22 -30 0 -34 Z"
          fill="#2E8B57"/>
    <path d="M0 -30 L0 32" stroke="#F6F8FB" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
    <path d="M0 -6 L-16 6 M0 8 L16 20" stroke="#F6F8FB" stroke-width="1.4" opacity="0.4" stroke-linecap="round"/>
  </g>
</svg>
