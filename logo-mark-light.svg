<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Globe -->
  <circle cx="100" cy="102" r="88" stroke="#0B3D91" stroke-width="2" opacity="0.35"/>
  <ellipse cx="100" cy="102" rx="34" ry="88" stroke="#0B3D91" stroke-width="2" opacity="0.35"/>
  <path d="M12 102 Q100 130 188 102" stroke="#0B3D91" stroke-width="2" opacity="0.35"/>
  <path d="M22 62 Q100 90 178 62" stroke="#0B3D91" stroke-width="1.5" opacity="0.25"/>
  <path d="M22 142 Q100 114 178 142" stroke="#0B3D91" stroke-width="1.5" opacity="0.25"/>

  <!-- Heart formed by two hands -->
  <path d="M100 168
           C 64 140 24 108 24 70
           C 24 42 46 22 71 22
           C 86 22 96 30 100 42
           C 104 30 114 22 129 22
           C 154 22 176 42 176 70
           C 176 108 136 140 100 168 Z"
